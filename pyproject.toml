[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadhaven"
version = "0.1.0rc1"
description = "Small checked task handovers for Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Cameron Mills"}]
dependencies = []

[project.scripts]
threadhaven = "threadhaven.cli:main"

[tool.setuptools.package-data]
threadhaven = ["skills/*/SKILL.md"]

[tool.setuptools.packages.find]
include = ["threadhaven*"]
