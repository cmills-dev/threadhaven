name: Test package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test storage, context and CLI
        run: python -m unittest discover -s tests -v
      - name: Build local release artifacts
        run: python scripts/build_release.py
      - name: Install wheel outside source and check reproducibility
        run: python scripts/smoke_wheel.py
